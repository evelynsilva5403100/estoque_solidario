<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - Estoque Solidário</title>
    <!-- Importando o Bootstrap para manter o padrão visual -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h2 class="mb-3 text-center text-success">Nova Senha</h2>
        <p class="text-muted text-center small mb-4">Digite a sua nova senha abaixo.</p>
        
        <form method="POST">
            <div class="mb-3">
                <label for="nova_senha" class="form-label">Nova Senha</label>
                <input type="password" class="form-control" id="nova_senha" name="nova_senha" required placeholder="Digite a nova senha">
            </div>
            <button type="submit" class="btn btn-success w-100">Salvar Nova Senha</button>
        </form>
    </div>

</body>
</html>
