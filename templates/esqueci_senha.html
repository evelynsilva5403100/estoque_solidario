<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Estoque Solidário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-5" style="width: 100%; max-width: 500px; border-radius: 12px;">
        <h2 class="mb-3 text-center text-success fw-bold">Recuperar Senha</h2>
        <p class="text-muted text-center mb-4">Informe seu e-mail e o telefone cadastrado para validar sua identidade.</p>
        
        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">E-mail</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email" required placeholder="seu@email.com">
            </div>
            <div class="mb-4">
                <label for="telefone" class="form-label fw-semibold">Telefone Cadastrado</label>
                <input type="text" class="form-control form-control-lg" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">Avançar para Nova Senha</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-success fw-semibold"> Voltar para o Login</a>
        </div>
    </div>

</body>
</html>
