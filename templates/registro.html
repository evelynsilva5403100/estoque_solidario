<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Solidário - Criar Nova Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-cadastro {
            max-width: 450px;
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.05);
        }
        .btn-verde {
            background-color: #2d6a4f;
            border: none;
            color: white;
        }
        .btn-verde:hover {
            background-color: #1b4332;
            color: white;
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 d-flex flex-column align-items-center">
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show w-100 text-center mb-4" role="alert" style="max-width: 450px;">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="card card-cadastro p-4 w-100 bg-white">
                    <div class="text-center mb-4">
                        <small class="text-muted d-block mb-1">Junte-se à Rede</small>
                        <h2 class="fw-bold" style="color: #1b4332;">Criar Nova Conta</h2>
                    </div>

                    <form action="{{ url_for('auth.cadastrar') }}" method="POST">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary">Usuário / Login</label>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Ex: mercadoprime ou ongajuda" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label fw-semibold text-secondary">Senha</label>
                            <input type="password" name="senha" id="senha" class="form-control" placeholder="Mínimo 6 caracteres" required>
                        </div>

                        <div class="mb-3">
                            <label for="nome_real" class="form-label fw-semibold text-secondary">Nome Completo / Razão Social</label>
                            <input type="text" name="nome_real" id="nome_real" class="form-control" placeholder="Ex: Mercado Central Ltda" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label fw-semibold text-secondary">Telefone de Contato</label>
                            <input type="text" name="telefone" id="telefone" class="form-control" placeholder="Ex: (87) 99999-9999" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-secondary">E-mail</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="Ex: contato@empresa.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="cidade" class="form-label fw-semibold text-secondary">Cidade</label>
                            <input type="text" name="cidade" id="cidade" class="form-control" placeholder="Ex: Garanhuns" required>
                        </div>

                        <div class="mb-3">
                            <label for="bairro" class="form-label fw-semibold text-secondary">Bairro</label>
                            <input type="text" name="bairro" id="bairro" class="form-control" placeholder="Ex: Centro" required>
                        </div>

                        <div class="mb-4">
                            <label for="tipo" class="form-label fw-semibold text-secondary">Tipo de Perfil</label>
                            <select name="tipo" id="tipo" class="form-select" required>
                                <option value="mercado">Doador (Pessoa Física / Empresa)</option>
                                <option value="ong">ONG / Entidade Beneficente</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-verde fw-semibold py-2">Concluir Cadastro</button>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary py-2">Voltar</a>
                        </div>

                        <div class="text-center mt-4">
                            <small class="text-muted">Já possui login? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold" style="color: #2d6a4f;">Clique aqui para entrar</a></small>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
